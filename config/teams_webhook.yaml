webhook:
  # Prefer shell/env over committing secrets. Local override: teams_webhook.local.yaml
  env_var: GRAFANA_TEAMS_WEBHOOK_URL
  source_order:
    - env
    - aws_secrets_manager
  aws_secrets_manager:
    enabled: true
    secret_name: grafana-alerts/provisioning
    secret_key: webhook_url
    region: us-west-1
